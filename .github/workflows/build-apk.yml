name: Build W-BLACK APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web files
        run: |
          mkdir -p www
          cp W_BLACK_MAIN-10-strategy-hardened-68-1-8-wolf-rank-badges-reordered.html www/index.html

      - name: Build APK
        uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "W-BLACK"
          app_id: "com.wblack.trading"
          web_dir: "www"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: W-BLACK-APK
          path: "**/*.apk"
